function forecast(cash, inv, exp, H, s) {
  let b = cash, w = cash, g = cash, m = cash;
  let min = cash, crunch = null, simMin = cash, simCrunch = null;
  const rows = [];
  for (let d = 0; d <= H; d++) {
    let inB = 0, inW = 0, inG = 0, out = 0, inS = 0, outS = 0;
    inv.forEach((i) => {
      if (i.paid) return;
      if (i.due === d) {
        inB += i.amount; inG += i.amount * 1.05;
        inW += i.amount * (i.conf === 'high' ? 0.95 : i.conf === 'medium' ? 0.65 : 0.35);
      }
      const sd = i.due + (i.id === s.clientId ? s.clientDelay : 0);
      if (sd === d) inS += i.amount * (1 - s.shock / 100);
    });
    exp.forEach((e) => {
      if (e.days.includes(d)) out += e.amount;
      if (s.pauseOpt && !e.essential) return;
      const sh = e.cat === 'Vendor' ? s.vendorDelay : 0;
      if (e.days.map((x) => x + sh).includes(d)) outS += e.amount;
    });
    if (s.hire > 0 && [15, 45, 75].includes(d)) outS += s.hire * s.heads;
    if (d > 0) { b += inB - out; w += inW - out * 1.05; g += inG - out; m += inS - outS; }
    if (b < min) min = b;
    if (b < 0 && crunch === null) crunch = d;
    if (m < simMin) simMin = m;
    if (m < 0 && simCrunch === null) simCrunch = d;
    rows.push({ d, base: Math.round(b), worst: Math.round(w), best: Math.round(g), sim: Math.round(m), inflow: inB, outflow: out });
  }
  return { rows, min, crunch, simMin, simCrunch };
}
 
function Chart({ rows, H, showSim, fmt, dark, crunch }) {
  const [hv, setHv] = useState(null);
  const W = 860, Ht = 300, p = { t: 20, r: 30, b: 36, l: 70 };
  const cw = W - p.l - p.r, ch = Ht - p.t - p.b;
  const vals = [0]; rows.forEach((r) => vals.push(r.base, r.worst, r.best, r.sim));
  const lo = Math.min(...vals), hi = Math.max(...vals);
  const yMin = Math.min(-5000, Math.floor((lo < 0 ? lo * 1.2 : -5000) / 5000) * 5000);
  const yMax = Math.max(10000, Math.ceil((hi * 1.15) / 5000) * 5000);
  const X = (d) => p.l + (d / H) * cw;
  const Y = (v) => p.t + ch - ((v - yMin) / (yMax - yMin)) * ch;
  const path = (k) => rows.map((r, i) => `${i ? 'L' : 'M'}${X(r.d)} ${Y(r[k])}`).join(' ');
  const onMove = (e) => {
    const rc = e.currentTarget.getBoundingClientRect();
    const sx = ((e.clientX - rc.left) / rc.width) * W;
    if (sx < p.l || sx > W - p.r) return setHv(null);
    setHv(rows[Math.min(H, Math.max(0, Math.round(((sx - p.l) / cw) * H)))]);
  };
  const grid = dark ? '#1e293b' : '#e2e8f0', txt = dark ? '#64748b' : '#94a3b8';
  return (
    <div className="relative">
      <svg viewBox={`0 0 ${W} ${Ht}`} className="w-full h-auto cursor-crosshair select-none" onMouseMove={onMove} onMouseLeave={() => setHv(null)}>
        {[0, 0.25, 0.5, 0.75, 1].map((q) => { const v = yMin + q * (yMax - yMin); return (
          <g key={q}><line x1={p.l} x2={W - p.r} y1={Y(v)} y2={Y(v)} stroke={grid} strokeDasharray="3 3" />
            <text x={p.l - 8} y={Y(v) + 3} fontSize="10" textAnchor="end" fill={txt}>{fmt(v)}</text></g>); })}
        <line x1={p.l} x2={W - p.r} y1={Y(0)} y2={Y(0)} stroke="#ef4444" strokeDasharray="4 4" />
        {[10, 20, 30, 45, 60, 75, 90].filter((d) => d <= H).map((d) => (
          <text key={d} x={X(d)} y={Ht - 14} fontSize="10" textAnchor="middle" fill={txt}>Day {d}</text>))}
        <path d={`${path('base')} L${X(H)} ${Y(yMin)} L${X(0)} ${Y(yMin)} Z`} fill="#10b981" opacity="0.15" />
        <path d={path('worst')} fill="none" stroke="#f59e0b" strokeDasharray="3 3" />
        <path d={path('best')} fill="none" stroke="#6ee7b7" />
        <path d={path('base')} fill="none" stroke="#10b981" strokeWidth="2.5" />
        {showSim && <path d={path('sim')} fill="none" stroke="#fbbf24" strokeWidth="2.5" strokeDasharray="5 3" />}
        <circle r="4.5" fill="#10b981" stroke="#fff" strokeWidth="1.5"><animateMotion dur="7s" repeatCount="indefinite" path={path('base')} /></circle>
        {crunch != null && crunch <= H && <g>
          <circle cx={X(crunch)} cy={Y(0)} r="6" fill="#ef4444" opacity="0.5"><animate attributeName="r" values="6;22;6" dur="1.8s" repeatCount="indefinite" /><animate attributeName="opacity" values="0.55;0;0.55" dur="1.8s" repeatCount="indefinite" /></circle>
          <circle cx={X(crunch)} cy={Y(0)} r="6" fill="#ef4444" stroke="#fff" strokeWidth="2" />
          <text x={X(crunch)} y={Y(0) - 16} fontSize="11" fontWeight="700" textAnchor="middle" fill="#ef4444">Deficit · Day {crunch}</text></g>}
        {hv && <g><line x1={X(hv.d)} x2={X(hv.d)} y1={p.t} y2={Ht - p.b} stroke="#fbbf24" strokeDasharray="2 2" />
          <circle cx={X(hv.d)} cy={Y(hv.base)} r="4" fill="#10b981" stroke="#fff" /></g>}
      </svg>
      {hv && (
        <div className={`absolute top-2 pointer-events-none p-3 rounded-xl border text-xs shadow-xl ${dark ? 'bg-slate-950/95 border-slate-800 text-slate-100' : 'bg-white border-slate-200 text-slate-900'}`}
          style={{ left: `${Math.min(Math.max(2, (X(hv.d) / W) * 100), 70)}%` }}>
          <div className="font-semibold text-amber-500">Day {hv.d} · <span className="text-emerald-400 font-mono">{fmt(hv.base)}</span></div>
          <div className="text-slate-400">Worst: <span className="font-mono text-amber-500">{fmt(hv.worst)}</span></div>
          {showSim && <div className="text-slate-400">Simulated: <span className="font-mono text-amber-400">{fmt(hv.sim)}</span></div>}
          <div className="text-slate-400">In: <span className="text-emerald-400 font-mono">+{fmt(hv.inflow)}</span> Out: <span className="text-rose-400 font-mono">-{fmt(hv.outflow)}</span></div>
        </div>)}
    </div>
  );
}

  const dl = (n, b) => { const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = n; a.click(); };
  const M = (x) => { const m = String(x).match(/(\d+(?:\.\d+)?)\s*(k|l|lakh|lac|cr|crore)?/i); if (!m) return 0; const u = (m[2] || '').toLowerCase(); return +m[1] * (u === 'k' ? 1e3 : u.startsWith('c') ? 1e7 : u ? 1e5 : 1); };
  const runAI = (text) => {
    const t = text.toLowerCase(), N = '(\\d+(?:\\.\\d+)?\\s*(?:k|l|lakh|lac|cr|crore)?)';
    const g = (re) => { const m = t.match(new RegExp(re)); return m ? M(m[1]) : 0; };
    const have = g(N + '\\s*(?:rs\\.?|inr|₹)?\\s*(?:in|in my)?\\s*(?:my\\s*)?(?:account|bank|cash|balance)') || g('(?:have|balance|cash)[^0-9]{0,15}' + N) || cash;
    const pay = g('(?:payable|bill|invoice|due|owe|pay)[^0-9]{0,20}' + N) || g(N + '\\s*(?:rs\\.?|inr|₹)?\\s*(?:payable|bill|due|invoice)');

              <div className="flex gap-2"><input id="drv" className={inp} placeholder="Paste a Google Drive file link" /><button className={btn} onClick={() => { const v = document.getElementById('drv').value; if (v) { setBill(readName('Drive_Invoice')); say('Link fetched', 'Confirm the details below'); } }}>Fetch</button></div>
              <p className="text-slate-400">Demo list only. A live Drive connection needs Google OAuth in your own backend.</p></div>)}
            {bill && (<div className={`p-3.5 rounded-xl border space-y-2 ${dark ? 'bg-slate-950 border-emerald-500/40' : 'bg-emerald-50 border-emerald-200'}`}>
              <b className="text-emerald-400">✔ Extracted details (edit if needed)</b>
              <div className="grid grid-cols-2 gap-2"><input className={inp} value={bill.title} onChange={(e) => setBill({ ...bill, title: e.target.value })} /><input className={inp} type="number" placeholder="Amount" value={bill.amount} onChange={(e) => setBill({ ...bill, amount: e.target.value })} />
                <input className={inp} type="number" min="1" max="90" value={bill.day} onChange={(e) => setBill({ ...bill, day: e.target.value })} />
                <select className={inp} value={bill.type} onChange={(e) => setBill({ ...bill, type: e.target.value })}><option value="payable">Payable (outflow)</option><option value="receivable">Receivable (inflow)</option></select></div>
              <button className={`${btn} w-full py-2.5`} onClick={commitBill}>Add to live forecast & ledger</button></div>)}
            <p className="text-slate-400">Demo files carry the amount and day in the file name. Photos need you to confirm the amount; automatic reading needs an OCR/AI API on your server.</p>
          </div></div>)}
 
      {csvOpen && (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
          <div className={`border rounded-2xl w-full max-w-lg p-6 space-y-4 text-xs ${dark ? 'bg-slate-900 border-emerald-500/40 text-white' : 'bg-white border-slate-200 text-slate-900'}`}>
            <div className="flex justify-between pb-3 border-b border-slate-800"><h3 className="font-bold text-base">Import CSV statement or ledger</h3><button onClick={() => { setCsvOpen(false); setCsvPrev(null); }} className="text-slate-400">✕</button></div>
            {!csvPrev ? (<label className={`block border-2 border-dashed rounded-xl p-8 text-center cursor-pointer ${dark ? 'border-slate-700 hover:border-amber-400' : 'border-slate-300 hover:border-amber-400'}`}>
              <input type="file" accept=".csv,.txt" className="hidden" onChange={(e) => onCsv(e.target.files[0])} /><div className="text-2xl">☁</div><b>Click to choose a CSV</b><p className="text-slate-400">Columns: type, title, amount, day, category</p></label>) : (
              <div className="space-y-3"><div className={`p-3 rounded-xl border ${dark ? 'bg-slate-950 border-slate-800' : 'bg-slate-50 border-slate-200'}`}><b className="text-emerald-400">CSV verified</b><p>{csvPrev.i.length} receivables · {csvPrev.e.length} payables{csvPrev.cash !== null && ` · opening cash ${fmt(csvPrev.cash)}`}</p></div>
                <div className="flex gap-2">{[['merge', 'Merge with current'], ['replace', 'Replace (clean start)']].map(([k, l]) => <button key={k} className={`flex-1 ${csvMode === k ? btn : ghost}`} onClick={() => setCsvMode(k)}>{l}</button>)}</div>
                <div className="flex justify-end gap-2"><button className={ghost} onClick={() => setCsvPrev(null)}>Back</button><button className={btn} onClick={applyCsv}>Apply to forecast</button></div></div>)}
            <div className="flex flex-wrap gap-2 pt-2 border-t border-slate-800"><button className={ghost} onClick={() => dl('cashflow_template.csv', new Blob([CSV_T], { type: 'text/csv' }))}>⬇ Download template</button>
              <button className={ghost} onClick={() => dl('demo_bank_statement.csv', new Blob([CSV_T], { type: 'text/csv' }))}>⬇ Download demo file</button></div>
          </div></div>)}
 
      {authOpen && (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
          <div className={`border rounded-2xl w-full max-w-md max-h-[90vh] overflow-y-auto nsb p-6 shadow-2xl space-y-4 ${dark ? 'bg-slate-900 border-amber-500/40 text-white' : 'bg-white border-slate-200 text-slate-900'}`}>
            <div className="flex items-center justify-between pb-3 border-b border-slate-800">
              <div><h3 className="font-bold text-base">{authMode === 'signup' ? 'Create Business Account' : 'Company Login'}</h3>
                <p className="text-[11px] text-slate-400">Sign in to manage company runway</p></div>
              <button onClick={() => setAuthOpen(false)} className="text-slate-400 hover:text-white">✕</button></div>
            <div className={`flex rounded-lg border p-0.5 text-xs font-semibold ${dark ? 'border-slate-800 bg-slate-950' : 'border-slate-200 bg-slate-100'}`}>
              {[['login', 'Log In'], ['signup', 'Create Account']].map(([m, l]) => (
                <button key={m} type="button" onClick={() => { setAuthMode(m); setAuthErr(''); }} className={`flex-1 py-1.5 rounded-md ${authMode === m ? 'bg-amber-400 text-slate-950' : 'text-slate-400'}`}>{l}</button>))}</div>
            {authErr && <div className="p-2.5 rounded-lg bg-rose-500/10 border border-rose-500/30 text-rose-400 text-xs font-medium">{authErr}</div>}
            <form onSubmit={submitAuth} className="space-y-3 text-xs">
              {authMode === 'signup' && field('Company / Business Name', 'companyName', { required: true, placeholder: 'e.g. Apex Innovations Pvt Ltd' })}
              {field('Business Email', 'email', { type: 'email', required: true, placeholder: 'founder@company.com' })}
              {authMode === 'signup' && field('Registered Business ID (optional)', 'businessId', { placeholder: 'GSTIN / CIN' })}
              <div className={authMode === 'signup' ? 'grid grid-cols-2 gap-3' : ''}>
                {field('Password', 'password', { type: 'password', required: true, placeholder: '••••••••' })}
                {authMode === 'signup' && field('Confirm Password', 'confirmPassword', { type: 'password', required: true, placeholder: '••••••••' })}</div>
              {authMode === 'signup' && (
                <div className="space-y-3 pt-3 border-t border-slate-800">
                  <h4 className="font-bold text-sm">Business Profile</h4>
                  {select('What type of business do you operate?', 'businessType', ['Retail / E-commerce', 'Manufacturing', 'Food & Restaurant', 'IT / Software', 'Wholesale / Distribution', 'Other'])}
                  {select('Average monthly revenue?', 'monthlyRevenue', ['Below ₹1 lakh', '₹1–5 lakh', '₹5–10 lakh', '₹10–25 lakh', 'Above ₹25 lakh'])}
                  <div className="grid grid-cols-2 gap-3">
                    {field('Current Bank Balance', 'currentCash', { type: 'number', required: true, placeholder: `${sym} Amount` })}
                    {field('Avg Monthly Expense', 'monthlyExpenditure', { type: 'number', required: true, placeholder: `${sym} Amount` })}</div>
                  <div className="grid grid-cols-2 gap-3">
                    {field('Pending Receivables', 'customerReceivables', { type: 'number', placeholder: `From customers (${sym})` })}
                    {field('Pending Payables', 'vendorPayables', { type: 'number', placeholder: `To vendors (${sym})` })}</div>
                  {select('Biggest financial challenge?', 'financialChallenge', ['Delayed customer payments', 'Cash shortages', 'Managing vendor payments', 'Unexpected expenses', 'Salary and tax management', 'Financial planning'])}
                </div>)}
              <div className="pt-3 border-t border-slate-800 space-y-2">
                <button type="submit" className="w-full py-2.5 bg-amber-400 hover:bg-amber-300 text-slate-950 font-bold rounded-xl">{authMode === 'signup' ? 'Create Account & Initialize Runway' : 'Sign In'}</button>
                {authMode === 'login' && <button type="button" className={`w-full py-2 font-semibold rounded-xl border ${dark ? 'bg-slate-950 text-amber-400 border-slate-800' : 'bg-slate-100 border-slate-200'}`}
                  onClick={() => { setAuth({ ...auth, email: 'founder@apex.com', password: 'password123' }); }}>⚡ Fill demo credentials (Apex Innovations)</button>}
              </div>
            </form>
          </div>
        </div>)}
    </div>
  );
}
 
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
